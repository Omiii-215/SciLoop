# =============================================================================
# SciLoop — Docker Compose for Local Development
# Phase 3: Distributed Execution
#
# Services:
#   - PostgreSQL: Campaign data, provenance, evidence
#   - Redis: Task queue, caching, pub/sub
#   - MinIO: Object storage for artifacts (structures, reports)
#   - MCP servers: PubMed, Protein DB, ChEMBL
#   - Sandbox: Python/RDKit scientific environment
#   - Worker: Task queue consumer
# =============================================================================

version: "3.9"

x-common-labels: &common-labels
  app: sciloop
  managed-by: docker-compose

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Infrastructure Services
  # ───────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sciloop-postgres
    environment:
      POSTGRES_DB: sciloop
      POSTGRES_USER: sciloop
      POSTGRES_PASSWORD: sciloop_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migration-phase2.sql:/docker-entrypoint-initdb.d/02-phase2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sciloop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      <<: *common-labels

  redis:
    image: redis:7-alpine
    container_name: sciloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      <<: *common-labels

  minio:
    image: minio/minio:latest
    container_name: sciloop-minio
    environment:
      MINIO_ROOT_USER: sciloop
      MINIO_ROOT_PASSWORD: sciloop_dev_secret
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      <<: *common-labels

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: sciloop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set sciloop http://minio:9000 sciloop sciloop_dev_secret;
      mc mb --ignore-existing sciloop/structures;
      mc mb --ignore-existing sciloop/molecules;
      mc mb --ignore-existing sciloop/reports;
      mc mb --ignore-existing sciloop/logs;
      mc mb --ignore-existing sciloop/artifacts;
      echo 'MinIO buckets initialized';
      "
    labels:
      <<: *common-labels

  # ───────────────────────────────────────────────────────────────────────────
  # MCP Tool Servers
  # ───────────────────────────────────────────────────────────────────────────

  mcp-pubmed:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-pubmed
    container_name: sciloop-mcp-pubmed
    restart: unless-stopped
    labels:
      <<: *common-labels
      component: mcp-server

  mcp-protein:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-protein
    container_name: sciloop-mcp-protein
    restart: unless-stopped
    labels:
      <<: *common-labels
      component: mcp-server

  mcp-chembl:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-chembl
    container_name: sciloop-mcp-chembl
    restart: unless-stopped
    labels:
      <<: *common-labels
      component: mcp-server

  # ───────────────────────────────────────────────────────────────────────────
  # Worker / Task Queue Consumer
  # ───────────────────────────────────────────────────────────────────────────

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: sciloop-worker
    command: ["workers/task-queue.js"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://sciloop:sciloop_dev@postgres:5432/sciloop
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: sciloop
      MINIO_SECRET_KEY: sciloop_dev_secret
      WORKER_CONCURRENCY: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      <<: *common-labels
      component: worker

  # ───────────────────────────────────────────────────────────────────────────
  # Scientific Sandbox
  # ───────────────────────────────────────────────────────────────────────────

  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    container_name: sciloop-sandbox
    command: ["-c", "import time; time.sleep(999999)"]  # Keep alive for exec
    volumes:
      - sandbox_data:/app/data
    restart: unless-stopped
    # Security: restrict capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=256m
    labels:
      <<: *common-labels
      component: sandbox

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  sandbox_data:
    driver: local
