apiVersion: v2
name: sciloop
description: SciLoop — Autonomous Scientific Research Campaign Agent
type: application
version: 0.3.0
appVersion: "3.0.0"
keywords:
  - scientific-research
  - drug-discovery
  - mcp
  - ai-agent
  - computational-biology
home: https://github.com/sciloop/sciloop
maintainers:
  - name: SciLoop Team
dependencies:
  - name: postgresql
    version: "~15.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "~19.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "~14.0"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
