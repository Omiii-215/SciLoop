# =============================================================================
# SciLoop — Argo Workflow: Parallel Molecule Filtering
# Splits a large SMILES list into batches and runs rdkit_filter.py in parallel
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sciloop-batch-filter
  namespace: sciloop
  labels:
    app.kubernetes.io/name: sciloop
    app.kubernetes.io/component: batch-workflow
  annotations:
    workflows.argoproj.io/description: |
      Parallel molecular filtering workflow.
      Splits candidates into batches and runs RDKit filters concurrently.
spec:
  entrypoint: batch-filter
  serviceAccountName: sciloop-worker
  arguments:
    parameters:
      - name: campaign-id
      - name: batch-count
        value: "5"
      - name: input-bucket
        value: "molecules"

  templates:
    - name: batch-filter
      steps:
        # Step 1: Split candidates into batches
        - - name: split-batches
            template: split-candidates
            arguments:
              parameters:
                - name: campaign-id
                  value: "{{workflow.parameters.campaign-id}}"
                - name: batch-count
                  value: "{{workflow.parameters.batch-count}}"

        # Step 2: Run filtering in parallel across batches
        - - name: filter-batch
            template: run-filter
            arguments:
              parameters:
                - name: campaign-id
                  value: "{{workflow.parameters.campaign-id}}"
                - name: batch-index
                  value: "{{item}}"
            withSequence:
              count: "{{workflow.parameters.batch-count}}"

        # Step 3: Merge results
        - - name: merge-results
            template: merge-filtered
            arguments:
              parameters:
                - name: campaign-id
                  value: "{{workflow.parameters.campaign-id}}"
                - name: batch-count
                  value: "{{workflow.parameters.batch-count}}"

    - name: split-candidates
      inputs:
        parameters:
          - name: campaign-id
          - name: batch-count
      container:
        image: sciloop/core:latest
        command: ["node", "-e"]
        args:
          - |
            console.log(JSON.stringify({
              step: "split_candidates",
              campaign_id: "{{inputs.parameters.campaign-id}}",
              batches: parseInt("{{inputs.parameters.batch-count}}"),
              status: "completed"
            }));

    - name: run-filter
      inputs:
        parameters:
          - name: campaign-id
          - name: batch-index
      container:
        image: sciloop/sandbox:latest
        command: ["python", "/app/sandbox-scripts/rdkit_filter.py"]
        env:
          - name: BATCH_INDEX
            value: "{{inputs.parameters.batch-index}}"
          - name: CAMPAIGN_ID
            value: "{{inputs.parameters.campaign-id}}"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi

    - name: merge-filtered
      inputs:
        parameters:
          - name: campaign-id
          - name: batch-count
      container:
        image: sciloop/core:latest
        command: ["node", "-e"]
        args:
          - |
            console.log(JSON.stringify({
              step: "merge_filtered",
              campaign_id: "{{inputs.parameters.campaign-id}}",
              batches_merged: parseInt("{{inputs.parameters.batch-count}}"),
              status: "completed"
            }));

---
# =============================================================================
# SciLoop — Argo Workflow: Parallel Molecule Scoring
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sciloop-batch-score
  namespace: sciloop
  labels:
    app.kubernetes.io/name: sciloop
    app.kubernetes.io/component: batch-workflow
spec:
  entrypoint: batch-score
  serviceAccountName: sciloop-worker
  arguments:
    parameters:
      - name: campaign-id
      - name: batch-count
        value: "3"

  templates:
    - name: batch-score
      steps:
        - - name: score-batch
            template: run-score
            arguments:
              parameters:
                - name: campaign-id
                  value: "{{workflow.parameters.campaign-id}}"
                - name: batch-index
                  value: "{{item}}"
            withSequence:
              count: "{{workflow.parameters.batch-count}}"

        - - name: aggregate-scores
            template: aggregate
            arguments:
              parameters:
                - name: campaign-id
                  value: "{{workflow.parameters.campaign-id}}"

    - name: run-score
      inputs:
        parameters:
          - name: campaign-id
          - name: batch-index
      container:
        image: sciloop/sandbox:latest
        command: ["python", "/app/sandbox-scripts/molecule_score.py"]
        env:
          - name: BATCH_INDEX
            value: "{{inputs.parameters.batch-index}}"
          - name: CAMPAIGN_ID
            value: "{{inputs.parameters.campaign-id}}"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi

    - name: aggregate
      inputs:
        parameters:
          - name: campaign-id
      container:
        image: sciloop/core:latest
        command: ["node", "-e"]
        args:
          - |
            console.log(JSON.stringify({
              step: "aggregate_scores",
              campaign_id: "{{inputs.parameters.campaign-id}}",
              status: "completed"
            }));
