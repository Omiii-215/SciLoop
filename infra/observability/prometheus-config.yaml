# =============================================================================
# SciLoop — Prometheus Configuration
# Phase 3: Distributed Execution — Observability
#
# Scrapes metrics from SciLoop services for monitoring campaign health,
# worker utilization, and experiment throughput.
# =============================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

  external_labels:
    cluster: sciloop
    environment: development

# ─────────────────────────────────────────────────────────────────────────────
# Alerting rules
# ─────────────────────────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# ─────────────────────────────────────────────────────────────────────────────
# Scrape targets
# ─────────────────────────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # SciLoop Worker nodes
  - job_name: "sciloop-workers"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["sciloop"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: worker
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  # MCP Servers
  - job_name: "sciloop-mcp-servers"
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["sciloop"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: mcp-server
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # PostgreSQL (via postgres-exporter sidecar)
  - job_name: "sciloop-postgres"
    static_configs:
      - targets: ["sciloop-postgres-metrics:9187"]
        labels:
          service: postgresql

  # Redis
  - job_name: "sciloop-redis"
    static_configs:
      - targets: ["sciloop-redis-metrics:9121"]
        labels:
          service: redis

  # MinIO
  - job_name: "sciloop-minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["sciloop-minio:9000"]
        labels:
          service: minio

# ─────────────────────────────────────────────────────────────────────────────
# Alerting rules (inline for simplicity)
# ─────────────────────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
