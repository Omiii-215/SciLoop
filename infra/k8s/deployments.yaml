# =============================================================================
# SciLoop — Worker Deployment
# Runs task queue consumers that pick up and execute experiments
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciloop-worker
  namespace: sciloop
  labels:
    app.kubernetes.io/name: sciloop-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: sciloop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sciloop-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sciloop-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: sciloop-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: sciloop/core:latest
          command: ["node", "workers/task-queue.js"]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sciloop-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sciloop-secrets
                  key: database-url
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sciloop-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sciloop-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sciloop-secrets
                  key: minio-secret-key
            - name: WORKER_CONCURRENCY
              value: "3"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "task-queue"]
            initialDelaySeconds: 10
            periodSeconds: 30
      restartPolicy: Always

---
# =============================================================================
# SciLoop — MCP Server Deployments
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciloop-mcp-pubmed
  namespace: sciloop
  labels:
    app.kubernetes.io/name: sciloop-mcp-pubmed
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sciloop-mcp-pubmed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sciloop-mcp-pubmed
        app.kubernetes.io/component: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: mcp-pubmed
          image: sciloop/mcp-pubmed:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

